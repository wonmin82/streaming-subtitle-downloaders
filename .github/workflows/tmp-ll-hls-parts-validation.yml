name: Temporary LL-HLS partial segment validation

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validate/ll-hls-parts
          fetch-depth: 0
      - name: Apply LL-HLS patch
        run: python3 .github/tmp/patch-ll-hls-parts.py
      - name: Check syntax and whitespace
        run: |
          node --check scripts/apple-tv-plus-subtitles-downloader.user.js
          node --check scripts/disney-plus-subtitles-downloader.user.js
          node --check scripts/coupang-play-subtitles-downloader.user.js
          node --check tests/regression.js
          git diff --check
      - name: Run permanent regression suite
        run: node tests/regression.js
      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/apple-tv-plus-subtitles-downloader.user.js scripts/disney-plus-subtitles-downloader.user.js scripts/coupang-play-subtitles-downloader.user.js tests/regression.js
          git commit -m "Validate LL-HLS partial segment support"
          git push origin HEAD:validate/ll-hls-parts
