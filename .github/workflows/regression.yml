name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Check shared HLS parser synchronization
        run: |
          node tools/sync-hls-segment-parser.js --check
          node tools/sync-hls-segment-parser.js --write
          git diff --exit-code -- scripts/apple-tv-plus-subtitles-downloader.user.js scripts/disney-plus-subtitles-downloader.user.js scripts/coupang-play-subtitles-downloader.user.js
      - name: Check shared fixture capture synchronization
        run: |
          node tools/sync-fixture-capture.js --check
          node tools/sync-fixture-capture.js --write
          git diff --exit-code -- scripts/apple-tv-plus-subtitles-downloader.user.js scripts/coupang-play-subtitles-downloader.user.js scripts/disney-plus-subtitles-downloader.user.js
      - name: Check JavaScript syntax
        run: |
          for file in scripts/*.user.js shared/*.js tools/*.js tools/fixture-lib/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Run regression suite
        run: node tests/regression.js
      - name: Test fixture capture core
        run: node tests/fixture-capture-core.js
      - name: Test Disney+ fixture capture adapter
        run: node tests/fixture-capture-disney.js
      - name: Test Apple TV+ fixture capture adapter
        run: node tests/fixture-capture-apple.js
      - name: Test Coupang Play fixture capture adapter
        run: node tests/fixture-capture-coupang.js
      - name: Test Netflix fixture capture adapter
        run: node tests/fixture-capture-netflix.js
      - name: Test fixture repository tooling
        run: node tests/fixture-tooling.js
      - name: Verify repository fixtures
        run: node tools/fixture.js verify-all
      - name: Replay repository fixtures
        run: node tests/fixture-replay.js
