name: Temporary TTML em geometry validation

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coupang-ttml-em-geometry-validation
          fetch-depth: 0
      - name: Apply TTML em geometry patch
        run: python3 .github/tmp/patch-ttml-em-geometry.py
      - name: Validate syntax and whitespace
        run: |
          node --check scripts/coupang-play-subtitles-downloader.user.js
          git diff --check
      - name: Validate TTML em geometry fixtures
        run: node .github/tmp/test-ttml-em-geometry.js
      - name: Commit validated service file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/coupang-play-subtitles-downloader.user.js
          git commit -m "Validate TTML em geometry implementation"
          git push origin HEAD:fix/coupang-ttml-em-geometry-validation
